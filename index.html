<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
    <title>Algoritma Tabayyun - Media Pembelajaran TV Touchscreen</title>
    <meta name="description" content="Media pembelajaran interaktif layar sentuh 65 inch mengintegrasikan Informatika (Berpikir Komputasional/Algoritma) dan Akidah Akhlak (Tabayyun) untuk siswa Kelas X." />
    <meta property="og:title" content="Algoritma Tabayyun - Media Pembelajaran TV Touchscreen" />
    <meta property="og:description" content="Media pembelajaran interaktif layar sentuh 65 inch mengintegrasikan Informatika (Berpikir Komputasional/Algoritma) dan Akidah Akhlak (Tabayyun) untuk siswa Kelas X." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 select-none overflow-x-hidden antialiased">
    <div id="root">
      <!-- High-fidelity boot loader: eliminates any blank white flash on all devices -->
      <div id="boot-loader" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#080d1a;color:#10b981;font-family:'DM Sans',-apple-system,sans-serif;text-align:center;padding:24px;box-sizing:border-box;">
        <div style="width:52px;height:52px;border:4px solid #1e293b;border-top-color:#10b981;border-radius:50%;animation:tabayyun-spin 0.9s linear infinite;margin-bottom:20px;"></div>
        <h2 style="color:#ffffff;margin:0 0 8px 0;font-size:24px;font-weight:800;letter-spacing:-0.5px;font-family:'Plus Jakarta Sans',sans-serif;">ALGORITMA TABAYYUN</h2>
        <p style="color:#94a3b8;margin:0;font-size:15px;max-width:420px;line-height:1.5;">Memuat media pembelajaran interaktif TV Touchscreen 65"...</p>
        
        <div id="boot-fallback" style="display:none;margin-top:28px;background:rgba(15,23,42,0.8);border:1px solid #334155;border-radius:16px;padding:16px 24px;max-width:380px;">
          <p style="color:#cbd5e1;font-size:13px;margin:0 0 12px 0;">Jika tampilan belum beralih otomatis dalam beberapa detik:</p>
          <a href="./algoritma-tabayyun-standalone.html" style="background:#10b981;color:#041f17;font-weight:bold;padding:10px 22px;border-radius:10px;text-decoration:none;font-size:14px;display:inline-block;box-shadow:0 4px 14px rgba(16,185,129,0.3);">
            Buka Versi Ringan (Standalone) &rarr;
          </a>
        </div>
      </div>
      <style>
        @keyframes tabayyun-spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          var fb = document.getElementById('boot-fallback');
          if (fb) fb.style.display = 'block';
        }, 3200);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
